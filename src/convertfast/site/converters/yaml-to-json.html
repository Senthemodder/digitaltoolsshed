<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Convert YAML to JSON Online — Free | ConvertFast</title>
    <meta name="description" content="Convert YAML to JSON instantly in your browser. Paste YAML or drop a .yaml/.yml file, get formatted JSON output.">
    <link rel="stylesheet" href="../style.css">
    <script>/* instant theme */
    (function(){var t=localStorage.getItem('cf-theme')||'light';document.documentElement.setAttribute('data-theme',t);})();
    </script>
    <script src="https://cdn.jsdelivr.net/npm/js-yaml@4.1.0/dist/js-yaml.min.js"></script>
</head>
<body>
    <nav class="navbar">
        <div class="container" style="display:flex;justify-content:space-between;align-items:center;padding:var(--space-md) var(--space-lg);">
            <a href="../index.html" style="font-family:var(--font-serif);font-weight:700;font-size:1.5rem;letter-spacing:0.05em;">CONVERTFAST</a>
            <div style="display:flex;gap:var(--space-md);align-items:center;">
                <a href="../index.html" style="font-family:var(--font-mono);font-size:0.85rem;letter-spacing:0.1em;">← ALL TOOLS</a>
                <button id="theme-toggle" style="font-size:1.2rem;padding:var(--space-xs) var(--space-sm);border:2px solid var(--border-color);background:var(--card-color);color:var(--text-color);cursor:pointer;">☀️</button>
            </div>
        </div>
    </nav>

    <main class="container" style="max-width:720px;margin:0 auto;padding:var(--space-2xl) var(--space-lg);">
        <div style="margin-bottom:var(--space-sm);">
            <span style="font-family:var(--font-mono);font-size:0.75rem;color:var(--muted-color);letter-spacing:0.15em;">HOME / CONVERTERS / YAML TO JSON</span>
        </div>
        
        <h1 style="font-family:var(--font-serif);font-size:2.5rem;font-weight:700;margin-bottom:var(--space-sm);">YAML to JSON Converter</h1>
        <p style="color:var(--muted-color);font-size:1.05rem;margin-bottom:var(--space-xl);">Convert YAML format to clean, formatted JSON output directly in your browser.</p>

        <!-- Formatting Options -->
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:var(--space-md);padding:var(--space-sm) 0;border-bottom:1px solid var(--border-subtle);">
            <span style="font-family:var(--font-serif);font-weight:700;">Indentation</span>
            <select id="indent-select" style="padding:var(--space-xs) var(--space-sm);border:2px solid var(--border-color);background:var(--card-color);color:var(--text-color);font-family:var(--font-mono);font-size:0.85rem;">
                <option value="2">2 Spaces</option>
                <option value="4">4 Spaces</option>
                <option value="tab">Tabs</option>
            </select>
        </div>

        <!-- Input Textarea Drop Zone -->
        <div id="drop-zone" style="border:2px dashed var(--border-color);padding:var(--space-md);background:var(--surface-color);margin-bottom:var(--space-md);transition:all 0.2s ease;">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:var(--space-xs);">
                <label for="input-text" style="font-family:var(--font-serif);font-weight:700;font-size:0.95rem;">Input YAML</label>
                <span style="font-family:var(--font-mono);font-size:0.75rem;color:var(--muted-color);">Paste text or drag & drop .yaml / .yml file</span>
            </div>
            <textarea id="input-text" placeholder="name: ConvertFast&#10;version: 1.0.0&#10;features:&#10;  - fast&#10;  - local&#10;  - secure" style="width:100%;min-height:220px;padding:var(--space-md);border:2px solid var(--border-color);background:var(--card-color);color:var(--text-color);font-family:var(--font-mono);font-size:0.85rem;resize:vertical;"></textarea>
        </div>

        <button id="convert-btn" style="width:100%;padding:var(--space-md);background:var(--text-color);color:var(--bg-color);font-family:var(--font-serif);font-weight:700;font-size:1.2rem;letter-spacing:0.05em;border:2px solid var(--border-color);box-shadow:4px 4px 0px var(--border-color);text-transform:uppercase;cursor:pointer;margin-bottom:var(--space-lg);">⚡ CONVERT TO JSON</button>

        <div id="status-msg" style="display:none;padding:var(--space-sm) var(--space-md);margin-bottom:var(--space-md);border:2px solid var(--border-color);font-family:var(--font-mono);font-size:0.85rem;"></div>

        <!-- Output JSON Section -->
        <div id="output-section" style="margin-bottom:var(--space-lg);">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:var(--space-xs);">
                <label for="output-text" style="font-family:var(--font-serif);font-weight:700;font-size:0.95rem;">Output JSON</label>
                <span id="output-stats" style="font-family:var(--font-mono);font-size:0.75rem;color:var(--muted-color);"></span>
            </div>
            <textarea id="output-text" readonly placeholder="JSON result will appear here..." style="width:100%;min-height:220px;padding:var(--space-md);border:2px solid var(--border-color);background:var(--surface-color);color:var(--text-color);font-family:var(--font-mono);font-size:0.85rem;resize:vertical;"></textarea>
            
            <div style="display:flex;gap:var(--space-md);margin-top:var(--space-md);">
                <button id="copy-btn" style="flex:1;padding:var(--space-md);background:var(--card-color);color:var(--text-color);font-family:var(--font-serif);font-weight:700;font-size:1rem;letter-spacing:0.05em;border:2px solid var(--border-color);box-shadow:3px 3px 0px var(--border-color);text-transform:uppercase;cursor:pointer;">📋 COPY JSON</button>
                <button id="download-btn" style="flex:1;padding:var(--space-md);background:var(--text-color);color:var(--bg-color);font-family:var(--font-serif);font-weight:700;font-size:1rem;letter-spacing:0.05em;border:2px solid var(--border-color);box-shadow:3px 3px 0px var(--border-color);text-transform:uppercase;cursor:pointer;">⬇️ DOWNLOAD .JSON</button>
            </div>
        </div>
    </main>

    <footer style="text-align:center;padding:var(--space-xl);border-top:1px solid var(--border-subtle);color:var(--muted-color);font-size:0.85rem;">
        <p>© 2026 ConvertFast — All tools run 100% in your browser.</p>
    </footer>

    <script>
        // Theme toggle
        document.getElementById('theme-toggle').addEventListener('click', function() {
            const current = document.documentElement.getAttribute('data-theme');
            const next = current === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', next);
            localStorage.setItem('cf-theme', next);
            this.textContent = next === 'dark' ? '☀️' : '🌙';
        });
        (function(){
            const t = document.documentElement.getAttribute('data-theme');
            document.getElementById('theme-toggle').textContent = t === 'dark' ? '☀️' : '🌙';
        })();

        // Helper functions
        function formatBytes(b) {
            if (b === 0) return '0 B';
            const k = 1024, s = ['B', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(b) / Math.log(k));
            return parseFloat((b / Math.pow(k, i)).toFixed(1)) + ' ' + s[i];
        }
        function downloadFile(blob, filename) {
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url; a.download = filename;
            document.body.appendChild(a); a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        // Element references
        const inputText = document.getElementById('input-text');
        const outputText = document.getElementById('output-text');
        const indentSelect = document.getElementById('indent-select');
        const convertBtn = document.getElementById('convert-btn');
        const statusMsg = document.getElementById('status-msg');
        const outputStats = document.getElementById('output-stats');
        const copyBtn = document.getElementById('copy-btn');
        const downloadBtn = document.getElementById('download-btn');
        const dropZone = document.getElementById('drop-zone');

        // Drag & Drop handlers
        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropZone.style.background = 'var(--card-color)';
            dropZone.style.borderStyle = 'solid';
        });
        dropZone.addEventListener('dragleave', (e) => {
            e.preventDefault();
            dropZone.style.background = 'var(--surface-color)';
            dropZone.style.borderStyle = 'dashed';
        });
        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.style.background = 'var(--surface-color)';
            dropZone.style.borderStyle = 'dashed';
            
            if (e.dataTransfer.files.length > 0) {
                const file = e.dataTransfer.files[0];
                if (file.name.endsWith('.yaml') || file.name.endsWith('.yml') || file.type.includes('yaml') || file.type.includes('text')) {
                    const reader = new FileReader();
                    reader.onload = (ev) => {
                        inputText.value = ev.target.result;
                        doConvert();
                    };
                    reader.readAsText(file);
                } else {
                    showStatus('Please drop a valid .yaml or .yml file.', true);
                }
            }
        });

        function getIndent() {
            const val = indentSelect.value;
            return val === 'tab' ? '\t' : parseInt(val, 10);
        }

        function showStatus(message, isError) {
            statusMsg.style.display = 'block';
            statusMsg.style.background = isError ? 'var(--surface-color)' : 'var(--card-color)';
            statusMsg.style.color = 'var(--text-color)';
            statusMsg.textContent = isError ? '❌ ' + message : '✓ ' + message;
        }

        function doConvert() {
            const raw = inputText.value;
            if (!raw.trim()) {
                outputText.value = '';
                outputStats.textContent = '';
                statusMsg.style.display = 'none';
                return;
            }

            if (typeof jsyaml === 'undefined') {
                showStatus('YAML parser library failed to load.', true);
                return;
            }

            try {
                const parsed = jsyaml.load(raw);
                const jsonResult = JSON.stringify(parsed, null, getIndent());
                outputText.value = jsonResult;
                const byteSize = new Blob([jsonResult]).size;
                outputStats.textContent = formatBytes(byteSize);
                showStatus('Converted successfully!', false);
            } catch (err) {
                outputText.value = '';
                outputStats.textContent = '';
                showStatus('YAML Syntax Error: ' + err.message, true);
            }
        }

        convertBtn.addEventListener('click', doConvert);
        indentSelect.addEventListener('change', () => {
            if (outputText.value.trim()) {
                doConvert();
            }
        });

        copyBtn.addEventListener('click', () => {
            if (!outputText.value) return;
            navigator.clipboard.writeText(outputText.value).then(() => {
                const origText = copyBtn.textContent;
                copyBtn.textContent = 'COPIED!';
                setTimeout(() => copyBtn.textContent = origText, 2000);
            });
        });

        downloadBtn.addEventListener('click', () => {
            if (!outputText.value) return;
            const blob = new Blob([outputText.value], { type: 'application/json' });
            downloadFile(blob, 'converted.json');
        });
    </script>
</body>
</html>
