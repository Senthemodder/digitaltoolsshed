<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Convert JSON to YAML Online — Free | ConvertFast</title>
    <meta name="description" content="Convert JSON to YAML instantly in your browser. No file upload required, 100% private and secure online developer tool.">
    <link rel="stylesheet" href="../style.css">
    <script>/* instant theme */
    (function(){var t=localStorage.getItem('cf-theme')||'light';document.documentElement.setAttribute('data-theme',t);})();
    </script>
    <style>
        .json-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: var(--space-md);
            margin-bottom: var(--space-lg);
        }
        @media (max-width: 640px) {
            .json-grid {
                grid-template-columns: 1fr;
            }
        }
        .drop-highlight {
            border-style: dashed !important;
            background-color: var(--card-color) !important;
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="container" style="display:flex;justify-content:space-between;align-items:center;padding:var(--space-md) var(--space-lg);">
            <a href="../index.html" style="font-family:var(--font-serif);font-weight:700;font-size:1.5rem;letter-spacing:0.05em;">CONVERTFAST</a>
            <div style="display:flex;gap:var(--space-md);align-items:center;">
                <a href="../index.html" style="font-family:var(--font-mono);font-size:0.85rem;letter-spacing:0.1em;">← ALL TOOLS</a>
                <button id="theme-toggle" style="font-size:1.2rem;padding:var(--space-xs) var(--space-sm);border:2px solid var(--border-color);background:var(--card-color);color:var(--text-color);cursor:pointer;">☀️</button>
            </div>
        </div>
    </nav>

    <main class="container" style="max-width:720px;margin:0 auto;padding:var(--space-2xl) var(--space-lg);">
        <div style="margin-bottom:var(--space-sm);">
            <span style="font-family:var(--font-mono);font-size:0.75rem;color:var(--muted-color);letter-spacing:0.15em;">HOME / CONVERTERS / JSON TO YAML</span>
        </div>
        
        <h1 style="font-family:var(--font-serif);font-size:2.5rem;font-weight:700;margin-bottom:var(--space-sm);">JSON to YAML Converter</h1>
        <p style="color:var(--muted-color);font-size:1.05rem;margin-bottom:var(--space-xl);">Paste your JSON code below or drop a .json file to convert it to YAML instantly in your browser.</p>

        <!-- Controls / Toolbar -->
        <div style="border:2px solid var(--border-color);background:var(--card-color);padding:var(--space-md);margin-bottom:var(--space-md);display:flex;gap:var(--space-sm);align-items:center;flex-wrap:wrap;">
            <label for="indent-select" style="font-family:var(--font-serif);font-weight:700;font-size:0.9rem;">Indent:</label>
            <select id="indent-select" style="padding:var(--space-xs) var(--space-sm);border:2px solid var(--border-color);background:var(--card-color);color:var(--text-color);font-family:var(--font-mono);font-size:0.85rem;cursor:pointer;">
                <option value="2" selected>2 Spaces</option>
                <option value="4">4 Spaces</option>
            </select>

            <button id="convert-btn" style="padding:var(--space-xs) var(--space-md);background:var(--text-color);color:var(--bg-color);font-family:var(--font-serif);font-weight:700;font-size:0.9rem;letter-spacing:0.05em;border:2px solid var(--border-color);box-shadow:2px 2px 0px var(--border-color);text-transform:uppercase;cursor:pointer;">⚡ CONVERT TO YAML</button>

            <button id="sample-btn" style="padding:var(--space-xs) var(--space-md);background:var(--card-color);color:var(--text-color);font-family:var(--font-serif);font-weight:700;font-size:0.9rem;letter-spacing:0.05em;border:2px solid var(--border-color);box-shadow:2px 2px 0px var(--border-color);text-transform:uppercase;cursor:pointer;">📝 SAMPLE</button>
        </div>

        <!-- Status Box -->
        <div id="status-box" style="display:none;padding:var(--space-sm) var(--space-md);border:2px solid var(--border-color);margin-bottom:var(--space-md);font-family:var(--font-mono);font-size:0.85rem;"></div>

        <!-- Grid layout -->
        <div class="json-grid">
            <div style="display:flex;flex-direction:column;gap:var(--space-xs);">
                <div style="display:flex;justify-content:space-between;align-items:center;">
                    <label for="input-text" style="font-family:var(--font-serif);font-weight:700;font-size:0.95rem;">Input JSON</label>
                    <button id="clear-btn" style="padding:2px 8px;background:none;border:1px solid var(--border-subtle);color:var(--muted-color);font-family:var(--font-mono);font-size:0.75rem;cursor:pointer;">Clear</button>
                </div>
                <div id="drop-zone" style="border:2px solid var(--border-color);transition:all 0.2s ease;">
                    <textarea id="input-text" style="width:100%;height:350px;padding:var(--space-md);border:none;background:var(--surface-color);color:var(--text-color);font-family:var(--font-mono);font-size:0.85rem;resize:vertical;display:block;box-sizing:border-box;outline:none;" placeholder='{"name": "ConvertFast", "version": 1.0, "features": ["fast", "private", "browser-only"]}'></textarea>
                </div>
                <div style="font-family:var(--font-mono);font-size:0.75rem;color:var(--muted-color);text-align:right;">
                    <span id="input-stats">0 chars</span>
                </div>
            </div>

            <div style="display:flex;flex-direction:column;gap:var(--space-xs);">
                <div style="display:flex;justify-content:space-between;align-items:center;">
                    <label for="output-text" style="font-family:var(--font-serif);font-weight:700;font-size:0.95rem;">Output YAML</label>
                    <span id="output-stats" style="font-family:var(--font-mono);font-size:0.75rem;color:var(--muted-color);">0 chars</span>
                </div>
                <div style="border:2px solid var(--border-color);">
                    <textarea id="output-text" readonly style="width:100%;height:350px;padding:var(--space-md);border:none;background:var(--surface-color);color:var(--text-color);font-family:var(--font-mono);font-size:0.85rem;resize:vertical;display:block;box-sizing:border-box;outline:none;" placeholder="YAML output will appear here..."></textarea>
                </div>
                <div style="display:flex;gap:var(--space-sm);margin-top:var(--space-xs);">
                    <button id="copy-btn" style="flex:1;padding:var(--space-sm);background:var(--card-color);color:var(--text-color);font-family:var(--font-serif);font-weight:700;font-size:0.9rem;letter-spacing:0.05em;border:2px solid var(--border-color);box-shadow:2px 2px 0px var(--border-color);text-transform:uppercase;cursor:pointer;">📋 COPY</button>
                    <button id="download-btn" style="flex:1;padding:var(--space-sm);background:var(--text-color);color:var(--bg-color);font-family:var(--font-serif);font-weight:700;font-size:0.9rem;letter-spacing:0.05em;border:2px solid var(--border-color);box-shadow:2px 2px 0px var(--border-color);text-transform:uppercase;cursor:pointer;">⬇️ DOWNLOAD</button>
                </div>
            </div>
        </div>
    </main>

    <footer style="text-align:center;padding:var(--space-xl);border-top:1px solid var(--border-subtle);color:var(--muted-color);font-size:0.85rem;">
        <p>© 2026 ConvertFast — All tools run 100% in your browser.</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/js-yaml@4.1.0/dist/js-yaml.min.js"></script>
    <script>
        // Theme toggle
        document.getElementById('theme-toggle').addEventListener('click', function() {
            const current = document.documentElement.getAttribute('data-theme');
            const next = current === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', next);
            localStorage.setItem('cf-theme', next);
            this.textContent = next === 'dark' ? '☀️' : '🌙';
        });
        (function(){
            const t = document.documentElement.getAttribute('data-theme');
            document.getElementById('theme-toggle').textContent = t === 'dark' ? '☀️' : '🌙';
        })();

        // Helper functions
        function formatBytes(b) {
            if (b === 0) return '0 B';
            const k = 1024, s = ['B', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(b) / Math.log(k));
            return parseFloat((b / Math.pow(k, i)).toFixed(1)) + ' ' + s[i];
        }

        function downloadFile(blob, filename) {
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url; a.download = filename;
            document.body.appendChild(a); a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        // Elements
        const inputText = document.getElementById('input-text');
        const outputText = document.getElementById('output-text');
        const indentSelect = document.getElementById('indent-select');
        const convertBtn = document.getElementById('convert-btn');
        const sampleBtn = document.getElementById('sample-btn');
        const clearBtn = document.getElementById('clear-btn');
        const copyBtn = document.getElementById('copy-btn');
        const downloadBtn = document.getElementById('download-btn');
        const statusBox = document.getElementById('status-box');
        const dropZone = document.getElementById('drop-zone');
        const inputStats = document.getElementById('input-stats');
        const outputStats = document.getElementById('output-stats');

        // Drag & Drop
        ['dragenter', 'dragover'].forEach(eventName => {
            dropZone.addEventListener(eventName, (e) => {
                e.preventDefault();
                e.stopPropagation();
                dropZone.classList.add('drop-highlight');
            }, false);
        });

        ['dragleave', 'drop'].forEach(eventName => {
            dropZone.addEventListener(eventName, (e) => {
                e.preventDefault();
                e.stopPropagation();
                dropZone.classList.remove('drop-highlight');
            }, false);
        });

        dropZone.addEventListener('drop', (e) => {
            const files = e.dataTransfer.files;
            if (files.length > 0) {
                const file = files[0];
                if (file.name.endsWith('.json') || file.type === 'application/json' || file.type === 'text/plain' || file.type === '') {
                    const reader = new FileReader();
                    reader.onload = (ev) => {
                        inputText.value = ev.target.result;
                        updateStats();
                        showStatus('Loaded file: ' + file.name + ' (' + formatBytes(file.size) + ')', 'info');
                        autoConvert();
                    };
                    reader.readAsText(file);
                } else {
                    showStatus('Please drop a valid JSON file.', 'error');
                }
            }
        });

        function updateStats() {
            const inLen = inputText.value.length;
            const outLen = outputText.value.length;
            inputStats.textContent = inLen.toLocaleString() + ' chars';
            outputStats.textContent = outLen.toLocaleString() + ' chars';
        }

        inputText.addEventListener('input', updateStats);

        function showStatus(message, type) {
            statusBox.style.display = 'block';
            statusBox.textContent = message;
            if (type === 'success') {
                statusBox.style.background = 'var(--surface-color)';
                statusBox.style.color = 'var(--text-color)';
                statusBox.style.borderColor = 'var(--border-color)';
            } else if (type === 'error') {
                statusBox.style.background = 'var(--bg-color)';
                statusBox.style.color = 'var(--text-color)';
                statusBox.style.borderColor = 'var(--border-color)';
            } else {
                statusBox.style.background = 'var(--surface-color)';
                statusBox.style.color = 'var(--muted-color)';
                statusBox.style.borderColor = 'var(--border-subtle)';
            }
        }

        function hideStatus() {
            statusBox.style.display = 'none';
        }

        function getIndent() {
            return parseInt(indentSelect.value, 10);
        }

        function performConversion() {
            const raw = inputText.value.trim();
            if (!raw) {
                showStatus('Please enter JSON text or upload a .json file first.', 'error');
                return false;
            }
            try {
                const parsed = JSON.parse(raw);
                outputText.value = jsyaml.dump(parsed, { indent: getIndent() });
                updateStats();
                showStatus('✓ Converted to YAML successfully!', 'success');
                return true;
            } catch (err) {
                showStatus('❌ Invalid JSON: ' + err.message, 'error');
                return false;
            }
        }

        function autoConvert() {
            if (inputText.value.trim()) {
                performConversion();
            }
        }

        convertBtn.addEventListener('click', performConversion);
        indentSelect.addEventListener('change', autoConvert);

        sampleBtn.addEventListener('click', () => {
            const sample = {
                title: "ConvertFast",
                version: "1.0.0",
                description: "Fast, private browser-based converter tools",
                features: [
                    "100% Client-side",
                    "No server uploads",
                    "High contrast design"
                ],
                settings: {
                    theme: "auto",
                    notifications: false
                }
            };
            inputText.value = JSON.stringify(sample, null, 2);
            updateStats();
            performConversion();
        });

        clearBtn.addEventListener('click', () => {
            inputText.value = '';
            outputText.value = '';
            updateStats();
            hideStatus();
        });

        copyBtn.addEventListener('click', () => {
            if (!outputText.value) {
                showStatus('Nothing to copy yet. Convert some JSON to YAML first!', 'error');
                return;
            }
            navigator.clipboard.writeText(outputText.value).then(() => {
                const origText = copyBtn.textContent;
                copyBtn.textContent = 'COPIED!';
                setTimeout(() => copyBtn.textContent = origText, 2000);
            });
        });

        downloadBtn.addEventListener('click', () => {
            if (!outputText.value) {
                showStatus('Nothing to download yet. Convert some JSON to YAML first!', 'error');
                return;
            }
            const blob = new Blob([outputText.value], { type: 'text/yaml' });
            downloadFile(blob, 'converted.yaml');
        });
    </script>
</body>
</html>
